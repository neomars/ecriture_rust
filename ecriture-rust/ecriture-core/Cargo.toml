[package]
name = "ecriture-core"
version = "0.1.0"
edition = "2021"
description = "Core backend logic for Ecriture: project management, export, synonyms, backups, and local Gemma AI (download + llama.cpp inference). Framework-agnostic (no Tauri dependency) so it can be unit-tested in isolation."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
html-escape = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
docx-rs = "0.4"
printpdf = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
llama-cpp-2 = "0.1"
encoding_rs = "0.8"

[features]
# GPU acceleration for the local Gemma engine is opt-in: each backend
# needs its vendor SDK installed at *build* time (CUDA toolkit, ROCm, or
# the Metal SDK on macOS), which most machines don't have, so enabling
# one unconditionally would break `cargo build` for everyone else the
# same way the clang/bindgen requirement did before it was documented.
# Pick the one matching your GPU and pass it through when building:
#   cargo build -p ecriture-rust --features ecriture-core/gpu-cuda
# See the README's "Local AI (Gemma)" section for OS-specific setup.
gpu-cuda = ["llama-cpp-2/cuda"]
gpu-rocm = ["llama-cpp-2/rocm"]
gpu-metal = ["llama-cpp-2/metal"]

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
