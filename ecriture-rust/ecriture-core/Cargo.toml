[package]
name = "ecriture-core"
version = "0.1.0"
edition = "2021"
description = "Core backend logic for Ecriture: project management, export, synonyms, backups, AI prompt plumbing. Framework-agnostic (no Tauri dependency) so it can be unit-tested in isolation."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
html-escape = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
docx-rs = "0.4"
printpdf = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
tempfile = "3"
