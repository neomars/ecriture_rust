name: Build

# Produces the actual distributable app for each OS: a Windows .exe
# (NSIS installer), a macOS .dmg, and a Linux .deb - each one built with
# GPU auto-detection baked in (gpu-vulkan on Linux/Windows, gpu-metal on
# macOS - see the README's "GPU acceleration" section for why), so the
# same binary uses the GPU when the machine running it has one and falls
# back to CPU otherwise, decided at runtime, not at build time.
#
# Run it by pushing a `v*` tag for a real release, or manually via the
# "Run workflow" button (Actions tab) to test a build without tagging
# anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: linux
            package_script: package:linux
          - platform: windows-latest
            name: windows
            package_script: package:windows
          - platform: macos-14
            name: macos
            package_script: package:macos

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # --- Linux: Tauri's own GTK/WebKit prerequisites, plus this
      # project's own (llama.cpp's build needs cmake + clang/libclang for
      # bindgen; gpu-vulkan needs the Vulkan loader + a GLSL->SPIR-V
      # compiler - see README "GPU acceleration"). Verified working with
      # this exact package list on Ubuntu 24.04.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            cmake \
            clang \
            libclang-dev \
            libvulkan-dev \
            glslc \
            glslang-tools \
            spirv-headers

      # --- Windows: gpu-vulkan needs the Vulkan SDK installed with
      # VULKAN_SDK set at build time (see README) - cmake/clang/MSVC
      # already ship on the windows-latest runner image. Installs the
      # official LunarG SDK installer directly rather than a third-party
      # from-source action: humbletim/setup-vulkan-sdk's component list
      # doesn't include shaderc (only Glslang, which builds
      # glslangValidator, not the glslc binary llama-cpp-sys-2 actually
      # needs) - confirmed against a real failed CI run. The official
      # installer bundles a working Bin/glslc.exe directly.
      #
      # Also sets CARGO_TARGET_DIR to a short path and CMAKE_GENERATOR to
      # Ninja: llama.cpp's ggml-vulkan CMakeLists builds its
      # "vulkan-shaders-gen" host tool as a separate CMake ExternalProject,
      # which hit two distinct, layered bugs on Windows, each confirmed
      # against a real CI run:
      #
      # 1. Its compiler-detection try_compile writes to a deeply nested
      #    scratch path (.../out/build/ggml/src/ggml-vulkan/vulkan-shaders
      #    -gen-prefix/src/vulkan-shaders-gen-build/CMakeFiles/CMakeScratch
      #    /TryCompile-xxxxxx/.../vc145.pdb). Under the default target dir
      #    (ecriture-rust/src-tauri/target) that path measured 269
      #    characters - over Windows' 260-char MAX_PATH - and MSVC's
      #    cl.exe reports an inaccessible-too-long path with the exact
      #    same misleading text as a genuine concurrent-write conflict
      #    ("cannot open program database ...; if multiple CL.EXE write
      #    to the same .PDB file, please use /FS"), which sent earlier
      #    fixes (the CL env var, CMAKE_BUILD_PARALLEL_LEVEL=1) chasing a
      #    concurrency theory that wasn't it. CARGO_TARGET_DIR=C:\ct
      #    shortens that path to 211 chars, fixing this one.
      #
      # 2. With #1 fixed, a second, real issue surfaced: the
      #    ExternalProject's "install" step started before its
      #    "configure"/"build" steps had finished ("CMake error: Not a
      #    file: .../cmake_install.cmake" - install racing ahead of the
      #    step that creates its input). This persisted even with
      #    CARGO_BUILD_JOBS=1 forcing `cmake --build --parallel 1` - the
      #    log still showed multiple MSBuild nodes ("1>"/"3>"/"4>")
      #    interleaving, because CMake's default Visual Studio generator
      #    models an ExternalProject's steps as custom-build rules within
      #    one .vcxproj that MSBuild's own task scheduler doesn't
      #    strictly serialize, regardless of --parallel. Switching to the
      #    Ninja generator (which the `cmake` crate has first-class
      #    support for via CMAKE_GENERATOR, confirmed by reading its
      #    source) builds from a real file-dependency DAG instead, where
      #    step ordering is enforced correctly - and lets CARGO_BUILD_JOBS
      #    revert to the default for a faster build.
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Write-Host "Installing Vulkan SDK $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile vulkan-sdk-installer.exe
          $proc = Start-Process -FilePath .\vulkan-sdk-installer.exe -ArgumentList "--root C:\VulkanSDK\$ver --accept-licenses --default-answer --confirm-command install" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Vulkan SDK installer exited with code $($proc.ExitCode)" }
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "CARGO_TARGET_DIR=C:\ct" | Out-File -FilePath $env:GITHUB_ENV -Append
          choco install ninja -y
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      # --- macOS: gpu-metal needs nothing beyond Xcode's command line
      # tools (already on the runner) except cmake, which the README also
      # calls out as not always preinstalled. llama.cpp's
      # ggml-backend-reg.cpp unconditionally uses std::filesystem::path /
      # u8path(), which Apple's SDK marks "introduced in macOS 10.15" -
      # below that deployment target, Clang's availability checks reject
      # that usage outright. A job-level MACOSX_DEPLOYMENT_TARGET env var
      # does NOT fix this: tauri-cli reads bundle.macOS.minimumSystemVersion
      # from tauri.conf.json (defaults to "10.13") and sets its own
      # MACOSX_DEPLOYMENT_TARGET from that when it spawns `cargo build`,
      # overriding whatever the job env says - confirmed via a real CI run
      # where the env var was set to 11.0 but llama-cpp-sys-2's build
      # script still saw MACOSX_DEPLOYMENT_TARGET=10.13. The actual fix is
      # tauri.conf.json's "bundle.macOS.minimumSystemVersion": "11.0".
      - name: Install cmake (macOS)
        if: matrix.platform == 'macos-14'
        run: brew install cmake

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            ecriture-rust/ecriture-core
            ecriture-rust/src-tauri

      # Runs directly inside ecriture-rust rather than via the repo root's
      # `npm install`/`npm run --prefix ecriture-rust` delegation: on
      # windows-latest, both the root's postinstall hook AND a plain
      # `npm install --prefix ecriture-rust` fail with "'npm' is not
      # recognized" - confirmed against two separate real failed CI runs
      # (Linux/macOS tolerate `--prefix` fine, something about Windows'
      # cmd.exe-based spawn under `--prefix` doesn't). cd'ing in directly
      # with working-directory avoids `--prefix` entirely.
      - name: Install npm dependencies
        working-directory: ecriture-rust
        run: npm install

      # bindgen's libclang doesn't always find its own bundled headers on
      # a fresh install - see the README's "stdbool.h file not found"
      # troubleshooting note.
      - name: Point bindgen at libclang's own headers (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(clang -print-resource-dir)/include" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: ecriture-rust
        run: npm run ${{ matrix.package_script }}

      # Windows builds under CARGO_TARGET_DIR=C:\ct (see the Vulkan SDK
      # step's comment on why), so its bundle lands outside the checkout.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecriture-rust-${{ matrix.name }}
          path: ${{ matrix.platform == 'windows-latest' && 'C:\ct\release\bundle\' || 'ecriture-rust/src-tauri/target/release/bundle/' }}
          if-no-files-found: warn

  # Only on a real `v*` tag push (not workflow_dispatch test runs): takes
  # the three platform artifacts build just produced and publishes them as
  # a GitHub Release, so downloaders get a normal release page with
  # permanent links instead of having to dig through this workflow run's
  # own Artifacts section (which also expire after 90 days).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ecriture-rust-*
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
